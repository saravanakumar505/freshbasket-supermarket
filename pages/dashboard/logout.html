<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Favicon & Apple Touch Icon -->
  <link rel="icon" type="image/png" href="../../assets/images/favicon.png">
  <link rel="apple-touch-icon" href="../../assets/images/favicon-192.png">
  <title>Logged Out — FreshBasket</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../../assets/css/style.css">
  <link rel="stylesheet" href="../../assets/css/dark-mode.css">
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white dark:bg-slate-900 p-10 rounded-3xl border border-slate-200 dark:border-slate-800 text-center max-w-sm w-full space-y-5 shadow-xl">
    <div class="w-20 h-20 rounded-full bg-emerald-100 dark:bg-emerald-950 flex items-center justify-center mx-auto">
      <i data-lucide="log-out" class="w-9 h-9 text-emerald-600"></i>
    </div>
    <div>
      <h2 class="text-xl font-extrabold font-heading text-slate-900 dark:text-white">You've Been Logged Out</h2>
      <p class="text-xs text-slate-500 mt-2">Thank you for visiting FreshBasket! Your session has ended safely.</p>
    </div>
    <div class="flex flex-col gap-3 pt-2">
      <a href="../login.html" class="px-6 py-3 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-bold rounded-xl transition-colors flex items-center justify-center gap-2">
        <i data-lucide="log-in" class="w-4 h-4"></i> Return to Login
      </a>
      <a href="../../index.html" class="px-6 py-3 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 hover:border-emerald-500 hover:text-emerald-600 text-sm font-bold rounded-xl transition-colors flex items-center justify-center gap-2">
        <i data-lucide="shopping-basket" class="w-4 h-4"></i> Continue Shopping
      </a>
    </div>
    <p class="text-[10px] text-slate-400">© 2026 FreshBasket Supermarket</p>
  </div>
  <script src="../../assets/js/main.js"></script>
  <script>
    // Clear demo auth state on logout
    try { localStorage.removeItem('fb_auth_user'); localStorage.removeItem('fb_session'); } catch(e) {}
  </script>
</body>
</html>
